name: Build & Release FPVTrackside

# Lives in a SEPARATE repo from the source, so nothing here can ever appear in a
# pull request against FPVTracksideCore (or its upstream). It WATCHES the source
# fork by polling on a schedule — there is no file in the source repo and no
# external infrastructure. Each new commit on the watched branch is built for
# every platform and published as a Release INTO the source fork.
#
# "Instant on push" is intentionally NOT used: that would require either a
# workflow file in the source repo (which could leak into an upstream PR) or an
# external webhook relay. Polling trades a few minutes of latency for zero
# footprint in the source. You can also run it on demand via "Run workflow".

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (branch, tag, or commit SHA)"
        required: true
        default: master
      release_tag:
        description: "Release tag (blank = auto-<shortsha>)"
        required: false
  # Build request: committing build-request.txt (line 1 = ref to build, line 2 =
  # optional release tag) builds that ref — the way to ask for a branch build
  # from a machine with git access but no GitHub token.
  push:
    branches: [main]
    paths: [build-request.txt]
  schedule:
        # Poll the watched branch every 5 minutes for a new commit. GitHub may delay
    # or coalesce scheduled runs under load (5 min is the effective floor), so
    # treat this as "within ~5-20 min".
    - cron: "*/5 * * * *"

env:
  # The source fork that holds the code AND receives the published release.
  SOURCE_REPO: bob9/FPVTracksideCore
  # Branch polled on the schedule. You commit straight to master, so this makes
  # "new master commit" == "new release".
  WATCH_BRANCH: master
  DOTNET_VERSION: "9.0.x"

jobs:
  # Decide whether there is a new commit that hasn't been released yet. State is
  # the existence of the auto-<shortsha> release on the fork — no extra storage.
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      ref: ${{ steps.decide.outputs.ref }}
      tag: ${{ steps.decide.outputs.tag }}
      # true for a build of anything other than the watched branch: published as
      # a pre-release so it never becomes "Latest".
      preview: ${{ steps.decide.outputs.preview }}
    steps:
      - name: Read the build request
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          sparse-checkout: build-request.txt
          sparse-checkout-cone-mode: false

      - id: decide
        env:
          GH_TOKEN: ${{ secrets.FORK_PAT }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ref_in="${{ inputs.ref }}"
            sha=$(gh api "repos/$SOURCE_REPO/commits/$ref_in" --jq .sha)
            tag="${{ inputs.release_tag }}"
            [ -z "$tag" ] && tag="auto-${sha:0:7}"
            preview=true
            [ "$ref_in" = "$WATCH_BRANCH" ] && preview=false
            {
              echo "should_build=true"
              echo "ref=$sha"
              echo "tag=$tag"
              echo "preview=$preview"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            ref_in=$(sed -n 1p build-request.txt | tr -d '[:space:]')
            tag=$(sed -n 2p build-request.txt | tr -d '[:space:]')
            sha=$(gh api "repos/$SOURCE_REPO/commits/$ref_in" --jq .sha)
            [ -z "$tag" ] && tag="auto-${sha:0:7}"
            preview=true
            [ "$ref_in" = "$WATCH_BRANCH" ] && preview=false
            {
              echo "should_build=true"
              echo "ref=$sha"
              echo "tag=$tag"
              echo "preview=$preview"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Scheduled poll: build only if the branch tip isn't already released.
          sha=$(gh api "repos/$SOURCE_REPO/commits/$WATCH_BRANCH" --jq .sha)
          tag="auto-${sha:0:7}"
          if gh release view "$tag" --repo "$SOURCE_REPO" >/dev/null 2>&1; then
            echo "should_build=false" >>"$GITHUB_OUTPUT"
            echo "No new commit on $WATCH_BRANCH (tip $sha already released as $tag)."
          else
            {
              echo "should_build=true"
              echo "ref=$sha"
              echo "tag=$tag"
            } >>"$GITHUB_OUTPUT"
            echo "New commit $sha -> will build and release $tag."
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            project: FPVTracksideCore/FPVTracksideCore.csproj
            asset: FPVTrackside-win-x64
          - os: macos-latest
            rid: osx-arm64
            project: FPVMacSideCore/FPVMacsideCore.csproj
            asset: FPVMacside-osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
            project: FPVTuxSideCore/FPVTuxsideCore.csproj
            asset: FPVTuxside-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the source fork at the new commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.ref }}
          token: ${{ secrets.FORK_PAT }}
          # Full history: the projects use Nerdbank.GitVersioning to derive the
          # build version from git height, which fails on a shallow clone.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The bracket web app (/brackets) is a Nuxt build embedded into Webb.dll,
      # so it must exist before dotnet publish. Skipped for source commits that
      # predate it (the DLL then serves a "not built" page).
      - name: Set up Node (bracket web app)
        if: hashFiles('BracketsUI/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BracketsUI/package-lock.json

      - name: Build the bracket web app
        if: hashFiles('BracketsUI/package.json') != ''
        working-directory: BracketsUI
        shell: bash
        run: npm ci && npm run generate

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish ${{ matrix.project }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o publish/${{ matrix.asset }}

      # Linux: ship a plain zip of the self-contained publish folder.
      - name: Package Linux (.zip)
        if: runner.os == 'Linux'
        run: cd publish && zip -r ${{ matrix.asset }}.zip ${{ matrix.asset }}

      # macOS: wrap the publish output in a .app bundle and build a draggable .dmg
      # (with an /Applications symlink). Unsigned — users right-click > Open once.
      - name: Package macOS (.dmg)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app="FPVTrackside.app"
          rm -rf "$app" dmgroot
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R "publish/${{ matrix.asset }}/." "$app/Contents/MacOS/"
          chmod +x "$app/Contents/MacOS/FPVMacsideCore"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
          <key>CFBundleName</key><string>FPVTrackside</string>
          <key>CFBundleDisplayName</key><string>FPVTrackside</string>
          <key>CFBundleIdentifier</key><string>com.bob9.fpvtrackside</string>
          <key>CFBundleVersion</key><string>1.0</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>CFBundleExecutable</key><string>FPVMacsideCore</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSMinimumSystemVersion</key><string>11.0</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          mkdir dmgroot
          cp -R "$app" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "FPVTrackside" -srcfolder dmgroot -ov -format UDZO "publish/${{ matrix.asset }}.dmg"

      # Windows: build an MSI with the WiX Toolset. Files are auto-harvested from
      # the publish folder; a Start Menu shortcut points at FPVTracksideCore.exe.
      # Version increments per run so MajorUpgrade can replace older installs.
      - name: Package Windows (.msi via WiX)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pin WiX v5: v6/v7 require accepting the paid OSMF EULA (WIX7015),
          # which blocks unattended CI. v5 is free and uses the v4/wxs schema.
          dotnet tool install --global wix --version 5.0.2
          $env:Path = "$env:Path;$env:USERPROFILE\.dotnet\tools"
          $ver = "1.0.0.$($env:GITHUB_RUN_NUMBER)"
          @'
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
            <Package Name="FPVTrackside" Manufacturer="bob9" Version="__VERSION__"
                     UpgradeCode="6f1d3a2e-9c4b-4f7a-9b2e-1a2b3c4d5e6f" Scope="perMachine">
              <MajorUpgrade DowngradeErrorMessage="A newer version of FPVTrackside is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <StandardDirectory Id="ProgramFiles64Folder">
                <Directory Id="INSTALLFOLDER" Name="FPVTrackside" />
              </StandardDirectory>
              <StandardDirectory Id="ProgramMenuFolder">
                <Directory Id="AppShortcutFolder" Name="FPVTrackside" />
              </StandardDirectory>
              <ComponentGroup Id="AppFiles" Directory="INSTALLFOLDER">
                <Files Include="publish\FPVTrackside-win-x64\**" />
              </ComponentGroup>
              <Component Id="AppShortcut" Directory="AppShortcutFolder" Guid="7a2e4b1c-0d5f-4a8b-9c3d-2b4e6f8a0c1d">
                <Shortcut Id="StartMenuShortcut" Name="FPVTrackside"
                          Target="[INSTALLFOLDER]FPVTracksideCore.exe" WorkingDirectory="INSTALLFOLDER" />
                <RemoveFolder Id="RemoveAppShortcutFolder" On="uninstall" />
                <RegistryValue Root="HKCU" Key="Software\bob9\FPVTrackside" Name="installed" Type="integer" Value="1" KeyPath="yes" />
              </Component>
              <Feature Id="Main">
                <ComponentGroupRef Id="AppFiles" />
                <ComponentRef Id="AppShortcut" />
              </Feature>
            </Package>
          </Wix>
          '@ -replace '__VERSION__', $ver | Out-File -Encoding utf8 Package.wxs
          # -pdbtype none: don't emit the .wixpdb so only the .msi is uploaded.
          wix build Package.wxs -arch x64 -pdbtype none -o "publish/${{ matrix.asset }}.msi"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: publish/${{ matrix.asset }}.*

  release:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      # Need the source (with full history) for two things the release page shows:
      # the Nerdbank.GitVersioning version and the recent-commits changelog.
      - name: Check out the source fork at the built commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.ref }}
          token: ${{ secrets.FORK_PAT }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Compute the version, rename the raw build outputs to friendly versioned
      # names (carrying the short sha so every automated build is uniquely named),
      # and write the formatted release notes.
      - name: Assemble release (version, asset names, notes)
        id: assemble
        env:
          REF: ${{ needs.check.outputs.ref }}
        run: |
          set -euo pipefail
          short_sha="${REF:0:7}"

          # Version from Nerdbank.GitVersioning (root version.json, git-height
          # based). Fall back to the short sha if nbgv is ever unavailable.
          dotnet tool install --global nbgv >/dev/null 2>&1 || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          version="$(nbgv get-version -v Version 2>/dev/null || true)"
          [ -z "$version" ] && version="0.0.0-${short_sha}"

          # Friendly, versioned asset names used both for the uploaded files and
          # in the Downloads section of the notes.
          mac_name="FPVTrackside-macOS-v${version}-${short_sha}.dmg"
          win_name="FPVTrackside-Windows-v${version}-${short_sha}.msi"
          lin_name="FPVTrackside-Linux-v${version}-${short_sha}.zip"

          # Rename whatever each platform produced. Guard each copy so a single
          # failed platform (fail-fast is off) never blocks the whole release.
          mkdir -p out
          [ -f dist/FPVMacside-osx-arm64.dmg ] && cp dist/FPVMacside-osx-arm64.dmg "out/${mac_name}"
          [ -f dist/FPVTrackside-win-x64.msi ] && cp dist/FPVTrackside-win-x64.msi "out/${win_name}"
          [ -f dist/FPVTuxside-linux-x64.zip ] && cp dist/FPVTuxside-linux-x64.zip "out/${lin_name}"

          # Last 10 commits as markdown links into the source repo.
          changelog="$(git log -10 --pretty=format:"- [\`%h\`](https://github.com/${SOURCE_REPO}/commit/%H) %s")"

          notes_file="$(pwd)/RELEASE_NOTES.md"
          # Dynamic top half (variable expansion on; backticks escaped).
          cat > "$notes_file" <<EOF
          ## 🚀 FPVTrackside Release v${version}

          ### 📦 Downloads
          - **macOS (Apple Silicon):** \`${mac_name}\`
          - **Windows (x64):** \`${win_name}\`
          - **Linux (x64):** \`${lin_name}\`

          ### 🔧 Platform Versions
          - **macOS Version:** ${version}
          - **Windows Version:** ${version}
          - **Linux Version:** ${version}

          ### 🔄 Recent Changes
          ${changelog}

          EOF
          # Static bottom half (quoted heredoc: no expansion, raw backticks OK).
          cat >> "$notes_file" <<'EOF'
          ### 📋 System Requirements
          **macOS**
          - macOS 11 (Big Sur) or later
          - Apple Silicon (M1/M2/M3) processor
          - Screen-recording permission may be required for screen-capture features

          **Windows**
          - Windows 10 x64 or later
          - No .NET install required — the runtime is bundled (self-contained build)

          **Linux**
          - 64-bit (x64) distribution
          - No .NET install required — the runtime is bundled (self-contained build)

          ### 📥 Installation
          **macOS**
          1. Download the macOS `.dmg` file
          2. Double-click the DMG to mount it
          3. Drag **FPVTrackside.app** to your Applications folder
          4. Eject the DMG when finished
          5. Right-click the app and choose **Open** on first launch (unsigned — Gatekeeper)
          6. Grant screen-recording permission if using screen capture

          **Windows**
          1. Download the Windows `.msi` installer
          2. Double-click the MSI to run the installer
          3. Follow the installation wizard
          4. Launch FPVTrackside from the Start Menu
          5. Windows Defender SmartScreen may require approval on first launch

          **Linux**
          1. Download the Linux `.zip`
          2. Extract it
          3. Run the `FPVTuxsideCore` binary from the extracted folder
          EOF

          {
            echo "version=$version"
            echo "notes_file=$notes_file"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release into the fork
        env:
          GH_TOKEN: ${{ secrets.FORK_PAT }}
        run: |
          set -euo pipefail
          tag="${{ needs.check.outputs.tag }}"
          title="FPVTrackside v${{ steps.assemble.outputs.version }}"
          notes_file="${{ steps.assemble.outputs.notes_file }}"
          # A branch preview is a pre-release and never "Latest".
          if [ "${{ needs.check.outputs.preview }}" = "true" ]; then
            kind=(--prerelease --latest=false)
          else
            kind=(--prerelease=false --latest)
          fi
          # Idempotent: a manual re-run of an already-released commit refreshes the
          # existing release's title, notes and assets instead of failing on a
          # duplicate tag. Published as a full Latest release (not a pre-release).
          if gh release view "$tag" --repo "$SOURCE_REPO" >/dev/null 2>&1; then
            echo "Release $tag exists — refreshing title, notes and assets."
            gh release edit "$tag" --repo "$SOURCE_REPO" \
              --title "$title" --notes-file "$notes_file" \
              "${kind[@]}"
            gh release upload "$tag" --repo "$SOURCE_REPO" --clobber out/*
          else
            gh release create "$tag" \
              --repo "$SOURCE_REPO" \
              --target "${{ needs.check.outputs.ref }}" \
              --title "$title" \
              --notes-file "$notes_file" \
              "${kind[@]}" \
              out/*
          fi
